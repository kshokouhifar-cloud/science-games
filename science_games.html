<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی‌های علوم ششم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff; min-height: 100vh; padding: 15px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 1.9em; margin: 15px 0; text-align: center;
       text-shadow: 0 0 20px rgba(100,200,255,.5); }
  .sub { color: #b0c4de; margin-bottom: 20px; text-align: center; font-size: .95em; }

  /* ===== screens ===== */
  .screen { display: none; width: 100%; max-width: 1000px; }
  .screen.active { display: block; }

  /* ===== start screen ===== */
  .start-box {
    background: rgba(255,255,255,.06);
    border: 2px solid rgba(100,200,255,.3);
    border-radius: 20px;
    padding: 35px 25px;
    text-align: center;
    max-width: 500px;
    margin: 40px auto;
  }
  .start-box .big-emoji { font-size: 4em; margin-bottom: 10px; }
  .start-box h2 { margin-bottom: 20px; font-size: 1.5em; color: #4fc3f7; }
  .start-box input {
    width: 100%; padding: 14px 18px;
    border-radius: 12px; border: 2px solid #4fc3f7;
    background: rgba(0,0,0,.3); color: #fff;
    font-size: 1.1em; font-family: inherit;
    text-align: center; margin-bottom: 18px;
  }
  .start-box input:focus { outline: none; border-color: #ffb74d; }
  .start-btn {
    background: linear-gradient(145deg, #4fc3f7, #0288d1);
    border: none; color: #fff;
    padding: 14px 40px; border-radius: 12px;
    font-size: 1.15em; font-weight: bold;
    cursor: pointer; font-family: inherit;
    width: 100%;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,195,247,.4); }
  .welcome { color: #ffb74d; font-size: 1.05em; margin-bottom: 15px; }

  /* ===== menu ===== */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
  }
  .player-badge {
    background: linear-gradient(145deg, #4caf50, #2e7d32);
    padding: 8px 16px; border-radius: 20px;
    font-size: .95em;
  }
  .logout-btn {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    color: #fff; padding: 8px 16px; border-radius: 20px;
    cursor: pointer; font-family: inherit; font-size: .9em;
  }
  .logout-btn:hover { background: #ff5252; border-color: #ff5252; }

  .menu {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: linear-gradient(145deg, #1e2a47, #2a3f5f);
    border-radius: 16px;
    padding: 18px 16px;
    cursor: pointer;
    border: 2px solid rgba(100,200,255,.2);
    transition: all .25s;
    position: relative;
    overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); border-color: #4fc3f7;
                box-shadow: 0 10px 25px rgba(79,195,247,.3); }
  .card .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .card .icon {
    font-size: 2.4em;
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(79,195,247,.15);
    border-radius: 14px;
    flex-shrink: 0;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .title { font-size: 1.1em; font-weight: bold; color: #4fc3f7; }
  .card .desc { font-size: .82em; color: #b0c4de; margin-top: 3px; }
  .card .lesson-tag {
    display: inline-block; font-size: .72em; color: #ffb74d;
    background: rgba(255,183,77,.12); padding: 2px 8px; border-radius: 20px;
    margin-top: 4px;
  }

  /* leaderboard in card */
  .lb {
    border-top: 1px dashed rgba(255,255,255,.15);
    padding-top: 10px; margin-top: 10px;
  }
  .lb-title { font-size: .8em; color: #ffb74d; margin-bottom: 6px; }
  .lb-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .lb-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .82em; padding: 4px 8px; border-radius: 8px;
    background: rgba(255,255,255,.04);
  }
  .lb-item.gold { background: rgba(255,215,0,.15); color: #ffd700; }
  .lb-item.silver { background: rgba(192,192,192,.12); color: #e0e0e0; }
  .lb-item.bronze { background: rgba(205,127,50,.12); color: #e0a060; }
  .lb-item .rank { font-weight: bold; margin-left: 6px; }
  .lb-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-item .pts { font-weight: bold; }
  .lb-empty { font-size: .8em; color: #666; text-align: center; padding: 6px; }

  /* ===== game ===== */
  .game-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 10px; flex-wrap: wrap;
  }
  .back-btn {
    background: #ff5252; border: none; color: #fff;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: .95em;
  }
  .back-btn:hover { background: #ff1744; }
  .score-box {
    background: linear-gradient(145deg, #4caf50, #388e3c);
    padding: 10px 20px; border-radius: 10px; font-weight: bold;
    box-shadow: 0 3px 10px rgba(76,175,80,.3);
  }

  .game-content {
    background: rgba(255,255,255,.05);
    border-radius: 20px;
    padding: 25px 20px;
    text-align: center;
    border: 1px solid rgba(100,200,255,.2);
    min-height: 380px;
  }
  .progress { color: #b0c4de; margin-bottom: 15px; font-size: .9em; }
  .question { font-size: 1.25em; margin-bottom: 20px; line-height: 1.7; }
  .big-item { font-size: 4.5em; margin: 10px 0; }
  .item-name { font-size: 1.6em; margin-bottom: 25px; color: #ffb74d; font-weight: bold; }

  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .opt-btn {
    background: linear-gradient(145deg, #2a3f5f, #1e2a47);
    border: 2px solid #4fc3f7;
    color: #fff; padding: 14px 22px;
    border-radius: 12px; font-size: 1em;
    cursor: pointer; font-family: inherit;
    transition: all .2s; min-width: 110px;
  }
  .opt-btn:hover { background: #4fc3f7; color: #1a1a2e; }
  .opt-btn.correct { background: #4caf50; border-color: #4caf50; }
  .opt-btn.wrong { background: #f44336; border-color: #f44336; }
  .opt-btn:disabled { cursor: default; }

  .feedback { font-size: 1.05em; margin-top: 18px; min-height: 30px;
              font-weight: bold; line-height: 1.6; }
  .feedback.ok { color: #66bb6a; }
  .feedback.no { color: #ff5252; }

  .layers-wrap { display: flex; flex-direction: column; gap: 10px;
                 max-width: 480px; margin: 15px auto; }
  .layer-item {
    padding: 14px 18px; border-radius: 12px; cursor: pointer;
    font-weight: bold; font-size: 1.05em; transition: all .2s;
    border: 2px solid transparent; text-align: right; color: #1a1a2e;
  }
  .layer-item:hover { transform: scale(1.02); }
  .layer-item.done { opacity: .35; cursor: default; }
  .layer-item.done::after { content: ' ✓'; color: #2e7d32; }
  .layer-item .hint { font-size: .75em; opacity: .8; display: block; margin-top: 3px; }

  .chain-slots { display: flex; gap: 6px; justify-content: center;
                 flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .slot {
    min-width: 78px; min-height: 78px; padding: 6px;
    border: 2px dashed rgba(100,200,255,.4); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(255,255,255,.03);
  }
  .slot.filled { border-style: solid; border-color: #4caf50; background: rgba(76,175,80,.15); }
  .slot .em { font-size: 1.8em; }
  .slot .nm { font-size: .7em; color: #b0c4de; margin-top: 3px; }
  .arrow { font-size: 1.3em; color: #4fc3f7; }
  .pool { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pool-item {
    width: 82px; padding: 6px;
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,.1); border-radius: 12px;
    cursor: pointer; border: 2px solid transparent; transition: all .2s;
  }
  .pool-item:hover { border-color: #4fc3f7; transform: scale(1.05); }
  .pool-item .em { font-size: 1.8em; }
  .pool-item .nm { font-size: .72em; color: #b0c4de; margin-top: 3px; }
  .pool-item.used { opacity: .15; pointer-events: none; }

  .finish { text-align: center; padding: 30px 15px; }
  .finish h2 { font-size: 1.7em; margin-bottom: 15px; color: #ffb74d; }
  .finish .big-score { font-size: 3.2em; color: #4fc3f7; margin: 15px 0; font-weight: bold; }
  .finish .msg { color: #b0c4de; margin-bottom: 25px; font-size: 1em; line-height: 1.7; }
  .again-btn {
    background: linear-gradient(145deg, #4fc3f7, #0288d1);
    border: none; color: #fff; padding: 14px 32px;
    border-radius: 12px; font-size: 1.05em; cursor: pointer;
    font-family: inherit; font-weight: bold;
  }
  .again-btn:hover { transform: translateY(-2px); }

  @media (max-width: 500px) {
    h1 { font-size: 1.4em; }
    .menu { grid-template-columns: 1fr; }
    .big-item { font-size: 3.5em; }
    .item-name { font-size: 1.3em; }
    .question { font-size: 1.05em; }
    .opt-btn { padding: 11px 14px; font-size: .92em; min-width: 95px; }
  }
</style>
</head>
<body>

<!-- ============ SCREEN 1: START ============ -->
<div class="screen active" id="screen-start">
  <div class="start-box">
    <div class="big-emoji">🔬</div>
    <h2>به بازی‌های علوم ششم خوش آمدی!</h2>
    <p style="color:#b0c4de; margin-bottom:20px;">اسمت رو بنویس تا شروع کنیم</p>
    <input id="nameInput" type="text" placeholder="مثلاً: علی رضایی" maxlength="20" autocomplete="off">
    <button class="start-btn" onclick="startWithName()">شروع بازی 🚀</button>
  </div>
</div>

<!-- ============ SCREEN 2: MENU ============ -->
<div class="screen" id="screen-menu">
  <div class="top-bar">
    <div class="player-badge">👤 <span id="menuName"></span></div>
    <button class="logout-btn" onclick="logout()">تغییر کاربر</button>
  </div>
  <h1>📚 بازی‌های علوم ششم</h1>
  <p class="sub">روی هر درس کلیک کن تا بازی کنی</p>
  <div class="menu" id="menu"></div>
</div>

<!-- ============ SCREEN 3: GAME ============ -->
<div class="screen" id="screen-game">
  <div class="game-header">
    <button class="back-btn" onclick="backToMenu()">← بازگشت</button>
    <div class="score-box">امتیاز: <span id="scoreEl">0</span></div>
  </div>
  <div class="game-content" id="gameContent"></div>
</div>

<script>
// ==================================================
// ذخیره و بارگذاری
// ==================================================
const STORAGE_KEY = 'science_game_scores_v1';
const NAME_KEY = 'science_game_player_name';

function loadScores() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveScores(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
function saveScore(gameId, name, score) {
  const all = loadScores();
  if (!all[gameId]) all[gameId] = [];
  all[gameId].push({
    name: name,
    score: score,
    date: new Date().toLocaleDateString('fa-IR')
  });
  // sort desc, keep top 20
  all[gameId].sort((a,b) => b.score - a.score);
  all[gameId] = all[gameId].slice(0, 20);
  saveScores(all);
}
function getTop3(gameId) {
  const all = loadScores();
  return (all[gameId] || []).slice(0, 3);
}

// ==================================================
// ابزار
// ==================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickN(arr, n) { return shuffle(arr).slice(0, n); }

function show(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0, 0);
}

// ==================================================
// state
// ==================================================
const state = { player: '', game: null, score: 0, idx: 0, data: {} };

// ==================================================
// START SCREEN
// ==================================================
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(NAME_KEY);
  if (saved) document.getElementById('nameInput').value = saved;
});

function startWithName() {
  const name = document.getElementById('nameInput').value.trim();
  if (name.length < 2) {
    alert('لطفاً نامت را وارد کن (حداقل ۲ حرف)');
    return;
  }
  state.player = name;
  localStorage.setItem(NAME_KEY, name);
  document.getElementById('menuName').textContent = name;
  show('screen-menu');
  renderMenu();
}

function logout() {
  if (!confirm('می‌خوای کاربر رو عوض کنی؟')) return;
  state.player = '';
  localStorage.removeItem(NAME_KEY);
  document.getElementById('nameInput').value = '';
  show('screen-start');
}

// ==================================================
// MENU
// ==================================================
const GAMES = [
  { id: 'lesson1',  icon: '🔬', title: 'زنگ علوم',        desc: 'مراحل روش علمی',           lesson: 'درس ۱' },
  { id: 'lesson2',  icon: '🌿', title: 'طبیعی یا مصنوعی', desc: 'دسته‌بندی مواد',           lesson: 'درس ۲' },
  { id: 'lesson3',  icon: '🧪', title: 'اسید و باز',      desc: 'کاغذ pH و اسیدها',         lesson: 'درس ۳' },
  { id: 'lesson4',  icon: '🌍', title: 'لایه‌های زمین',   desc: 'پوسته تا هسته',            lesson: 'درس ۴' },
  { id: 'lesson5',  icon: '🌋', title: 'زمین‌لرزه و آتش‌فشان', desc: 'ایمنی و پدیده‌ها',      lesson: 'درس ۵' },
  { id: 'lesson6',  icon: '⚽', title: 'ورزش و نیرو',      desc: 'نیرو، اصطکاک، فشار',      lesson: 'درس ۶ و ۷' },
  { id: 'lesson9',  icon: '⚡', title: 'سفر انرژی',        desc: 'تبدیلات انرژی',            lesson: 'درس ۹' },
  { id: 'lesson11', icon: '🌱', title: 'فتوسنتز',         desc: 'غذاسازی گیاهان',          lesson: 'درس ۱۱' },
  { id: 'lesson12', icon: '🦊', title: 'زنجیره غذایی',    desc: 'رابطه جانداران',           lesson: 'درس ۱۲' },
  { id: 'lesson13', icon: '🦠', title: 'میکروب‌ها',        desc: 'دفاع بدن و بیماری',       lesson: 'درس ۱۳' },
];

function renderMenu() {
  const menu = document.getElementById('menu');
  menu.innerHTML = GAMES.map(g => {
    const top = getTop3(g.id);
    let lbHTML = '';
    if (top.length === 0) {
      lbHTML = '<div class="lb-empty">هنوز کسی بازی نکرده - تو اول باش! 🥇</div>';
    } else {
      const classes = ['gold', 'silver', 'bronze'];
      const medals = ['🥇', '🥈', '🥉'];
      lbHTML = top.map((t, i) => `
        <div class="lb-item ${classes[i]}">
          <span class="rank">${medals[i]}</span>
          <span class="name">${escapeHtml(t.name)}</span>
          <span class="pts">${t.score}</span>
        </div>
      `).join('');
    }
    return `
      <div class="card" onclick="startGame('${g.id}')">
        <div class="head">
          <div class="icon">${g.icon}</div>
          <div class="info">
            <div class="title">${g.title}</div>
            <div class="desc">${g.desc}</div>
            <div class="lesson-tag">${g.lesson}</div>
          </div>
        </div>
        <div class="lb">
          <div class="lb-title">🏆 برترین‌ها</div>
          <div class="lb-list">${lbHTML}</div>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function backToMenu() {
  show('screen-menu');
  renderMenu();
}

// ==================================================
// GAME ENGINE
// ==================================================
function startGame(id) {
  state.game = id;
  state.score = 0;
  state.idx = 0;
  updateScore();
  show('screen-game');
  const fn = GAME_STARTERS[id];
  if (fn) fn();
}
function updateScore() {
  document.getElementById('scoreEl').textContent = state.score;
}
function finishGame(maxScore, msg) {
  saveScore(state.game, state.player, state.score);
  const el = document.getElementById('gameContent');
  const pct = Math.round(state.score / maxScore * 100);
  let emoji = '💪', extra = msg || '';
  if (pct >= 90) { emoji = '🏆'; extra = 'عالی! تو یک دانشمند کوچولویی!'; }
  else if (pct >= 70) { emoji = '🌟'; extra = 'خیلی خوب بود!'; }
  else if (pct >= 50) { emoji = '👍'; extra = 'بد نبود، ادامه بده!'; }
  else { emoji = '💪'; extra = 'اشکالی نداره، دوباره تلاش کن!'; }

  // top 3 after this game
  const top = getTop3(state.game);
  const classes = ['gold','silver','bronze'];
  const medals = ['🥇','🥈','🥉'];
  const lbHTML = top.map((t, i) => `
    <div class="lb-item ${classes[i]}" style="margin:4px 0;">
      <span class="rank">${medals[i]}</span>
      <span class="name">${escapeHtml(t.name)}</span>
      <span class="pts">${t.score}</span>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="finish">
      <h2>${emoji} بازی تمام شد!</h2>
      <div class="big-score">${state.score} / ${maxScore}</div>
      <p class="msg">${extra}</p>
      <div style="background:rgba(255,255,255,.05); border-radius:14px; padding:14px; margin-bottom:20px; max-width:380px; margin-left:auto; margin-right:auto;">
        <div style="color:#ffb74d; font-size:.9em; margin-bottom:8px;">🏆 برترین‌های این درس</div>
        <div class="lb-list">${lbHTML}</div>
      </div>
      <button class="again-btn" onclick="startGame('${state.game}')">🔄 بازی دوباره</button>
      <button class="again-btn" style="background:linear-gradient(145deg,#7e57c2,#4527a0); margin-top:10px;" onclick="backToMenu()">📚 درس‌های دیگر</button>
    </div>
  `;
}

// ==================================================
// GAME 1: درس ۱ - زنگ علوم (روش علمی)
// ==================================================
const LESSON1 = [
  { q: 'در آزمایش «برخورد شهاب‌سنگ با زمین»، اولین کاری که یک دانشمند می‌کند چیست؟',
    opts: ['نتیجه‌گیری', 'مشاهده و طرح پرسش', 'رسم نمودار', 'ساختن مدل'], ans: 1 },
  { q: '«هرچه شهاب‌سنگ بزرگ‌تر باشد، گودال بزرگ‌تری ایجاد می‌کند» این جمله چیست؟',
    opts: ['نتیجه', 'پیش‌بینی (فرضیه)', 'مشاهده', 'آزمایش'], ans: 1 },
  { q: 'برای بررسی فرضیه، دانشمند باید چه کار کند؟',
    opts: ['فقط فکر کند', 'آزمایش و کاوش کند', 'از معلم بپرسد', 'کتاب بخواند'], ans: 1 },
  { q: 'در آزمایش شهاب‌سنگ، از توپ و ظرف خاک استفاده شد. توپ نقش چه چیزی را داشت؟',
    opts: ['زمین', 'شهاب‌سنگ', 'جو', 'ماه'], ans: 1 },
  { q: 'کدام‌یک از مراحل روش علمی، در انتها انجام می‌شود؟',
    opts: ['مشاهده', 'فرضیه', 'آزمایش', 'نتیجه‌گیری'], ans: 3 },
  { q: 'اگر در آزمایش، نتیجه‌ی فرضیه‌ی ما را تأیید نکند، چه باید کرد؟',
    opts: ['آزمایش را پاک کنیم', 'فرضیه را تغییر دهیم', 'دروغ بگوییم', 'رها کنیم'], ans: 1 },
  { q: 'در آزمایش شهاب‌سنگ، برای بررسی اثر «سرعت»، چه چیزی را تغییر می‌دهیم؟',
    opts: ['جرم توپ', 'نوع خاک', 'ارتفاع رها کردن', 'اندازه ظرف'], ans: 2 },
  { q: 'مهم‌ترین کاری که یک دانشمند پس از آزمایش انجام می‌دهد چیست؟',

const CHAINS_DATA = [
  { name:'جنگل بلوط', items:[{n:'برگ بلوط',e:'🍃'},{n:'موش',e:'🐭'},{n:'مار',e:'🐍'},{n:'شاهین',e:'🦅'}] },
  { name:'چمن‌زار',   items:[{n:'هویج',e:'🥕'},{n:'خرگوش',e:'🐰'},{n:'روباه',e:'🦊'}] },
  { name:'مزرعه',     items:[{n:'گیاه',e:'🌾'},{n:'ملخ',e:'🦗'},{n:'قورباغه',e:'🐸'},{n:'مار',e:'🐍'}] },
  { name:'دریا',      items:[{n:'جلبک',e:'🌿'},{n:'ماهی کوچک',e:'🐟'},{n:'ماهی بزرگ',e:'🐠'},{n:'کوسه',e:'🦈'}] },
  { name:'قطب',       items:[{n:'جلبک',e:'🌿'},{n:'کریل',e:'🦐'},{n:'ماهی',e:'🐟'},{n:'پنگوئن',e:'🐧'},{n:'فوک',e:'🦭'}] },
];

GAME_STARTERS.lesson12 = function() {
  state.data = { list: shuffle(CHAINS_DATA).slice(0, 3), idx: 0, current: null, filled: [], pool: [] };
  loadChain();
};
function loadChain() {
  if (state.data.idx >= state.data.list.length) return finishGame(state.data.list.length * 30 + 20);
  const chain = state.data.list[state.data.idx];
  state.data.current = chain;
  state.data.filled = [];
  state.data.pool = shuffle(chain.items);
  renderChain();
}
function renderChain() {
  const chain = state.data.current;
  const el = document.getElementById('gameContent');
  let slotsHTML = '';
  chain.items.forEach((_, i) => {
    const f = state.data.filled[i];
    slotsHTML += `<div class="${f ? 'slot filled' : 'slot'}">${f ? `<div class="em">${f.e}</div><div class="nm">${f.n}</div>` : '<div class="em">؟</div>'}</div>`;
    if (i < chain.items.length - 1) slotsHTML += '<div class="arrow">→</div>';
  });
  el.innerHTML = `
    <div class="progress">زنجیره ${state.data.idx + 1} از ${state.data.list.length} - ${chain.name}</div>
    <div class="question">جانداران را به ترتیب زنجیره غذایی بچین 🍽️</div>
    <div class="chain-slots">${slotsHTML}</div>
    <div class="pool" id="poolWrap"></div>
    <div class="feedback" id="fb">👉 باید اول ${chain.items[0].n} انتخاب شود</div>
  `;
  const pool = document.getElementById('poolWrap');
  state.data.pool.forEach(item => {
    const used = state.data.filled.find(f => f && f.n === item.n);
    const div = document.createElement('div');
    div.className = 'pool-item' + (used ? ' used' : '');
    div.innerHTML = `<div class="em">${item.e}</div><div class="nm">${item.n}</div>`;
    if (!used) div.onclick = () => pickChain(item);
    pool.appendChild(div);
  });
}
function pickChain(item) {
  const chain = state.data.current;
  const next = state.data.filled.length;
  const fb = document.getElementById('fb');
  if (item.n === chain.items[next].n) {
    state.data.filled.push(item);
    state.score += 30; updateScore();
    fb.className = 'feedback ok'; fb.textContent = `✅ درست! ${item.n}`;
    setTimeout(() => {
      if (state.data.filled.length === chain.items.length) {
        state.score += 20; updateScore();
        state.data.idx++;
        fb.textContent = '🎉 زنجیره کامل شد!';
        setTimeout(loadChain, 1000);
      } else renderChain();
    }, 600);
  } else {
    fb.className = 'feedback no'; fb.textContent = `❌ نه، الان نوبت "${item.n}" نیست.`;
  }
}
